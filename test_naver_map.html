<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Naver Map API Test</title>
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpClientId=oimsa0yj4k"></script>
    <style>
        #map { width: 100%; height: 400px; }
        #status { padding: 20px; font-family: Arial; }
        .success { color: green; font-weight: bold; }
        .error { color: red; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Naver Map API 테스트</h1>
    <div id="status">로딩 중...</div>
    <div id="map"></div>
    
    <script>
        window.addEventListener('load', function() {
            const statusDiv = document.getElementById('status');
            
            // Check if naver object is loaded
            if (typeof naver === 'undefined' || typeof naver.maps === 'undefined') {
                statusDiv.innerHTML = '<span class="error">❌ 네이버 지도 API 로드 실패</span><br>' +
                    '원인: Client ID가 유효하지 않거나 URL이 등록되지 않았습니다.<br>' +
                    'Client ID: oimsa0yj4k<br>' +
                    '현재 URL: ' + window.location.href + '<br><br>' +
                    '<strong>조치 필요:</strong><br>' +
                    '1. https://www.ncloud.com/ 로그인<br>' +
                    '2. Console → Services → AI·NAVER API → Maps<br>' +
                    '3. Application (Client ID: oimsa0yj4k) 선택<br>' +
                    '4. Web Service URL에 다음 추가:<br>' +
                    '   - http://139.150.11.99<br>' +
                    '   - http://139.150.11.99/*<br>' +
                    '   - http://139.150.11.99/vehicles';
                return;
            }
            
            try {
                // Try to create a map
                const mapOptions = {
                    center: new naver.maps.LatLng(37.5665, 126.9780), // Seoul
                    zoom: 10
                };
                
                const map = new naver.maps.Map('map', mapOptions);
                
                statusDiv.innerHTML = '<span class="success">✅ 네이버 지도 API 정상 작동</span><br>' +
                    'Client ID: oimsa0yj4k<br>' +
                    '현재 URL: ' + window.location.href + '<br>' +
                    'URL 등록 상태: <strong>등록됨 ✅</strong><br><br>' +
                    '지도가 정상적으로 표시되면 URL이 올바르게 등록된 것입니다.';
                    
            } catch (error) {
                statusDiv.innerHTML = '<span class="error">❌ 지도 생성 실패</span><br>' +
                    '에러: ' + error.message + '<br>' +
                    'Client ID: oimsa0yj4k<br>' +
                    '현재 URL: ' + window.location.href;
            }
        });
        
        // Listen for script load errors
        window.addEventListener('error', function(e) {
            if (e.target.tagName === 'SCRIPT') {
                const statusDiv = document.getElementById('status');
                statusDiv.innerHTML = '<span class="error">❌ 스크립트 로드 실패</span><br>' +
                    'URL이 네이버 클라우드 콘솔에 등록되지 않았을 가능성이 높습니다.';
            }
        }, true);
    </script>
</body>
</html>
